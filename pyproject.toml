[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flexpulse-ml"
version = "0.2.0"
description = "FlexPulse-ML: A Simulation-Based Self-Calibrating Machine Learning Framework for Intermittent Fault Detection in USB-C-Inspired Power Paths"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "FlexPulse-ML Research Team" }
]
keywords = [
    "simulation",
    "machine-learning",
    "power-path",
    "fault-detection",
    "adaptive-calibration"
]
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.8.0",
    "plotly>=5.18.0",
    "streamlit>=1.30.0",
    "pyyaml>=6.0.0",
    "joblib>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[project.scripts]
flexpulse = "flexpulse_ml.cli:main"

[tool.setuptools.packages.find]
include = ["flexpulse_ml*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = [
    "tests",
]
