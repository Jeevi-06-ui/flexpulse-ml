[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flexpulse-ml"
version = "0.1.0"
description = "FlexPulse-ML: An Active Self-Calibrating Machine Learning System for Early Detection and Localization of Intermittent USB-C Cable Faults"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "FlexPulse-ML Research Team", email = "research@presidencyuniversity.in" }
]
keywords = ["machine-learning", "usb-c", "fault-detection", "scientific-ml", "uncertainty-calibration"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.8.0",
    "plotly>=5.18.0",
    "streamlit>=1.30.0",
    "pyserial>=3.5",
    "joblib>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[project.scripts]
flexpulse = "flexpulse_ml.cli:main"

[tool.setuptools.packages.find]
include = ["flexpulse_ml*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = [
    "tests",
]

